services:
  antigravity:
    build:
      context: .
      tags:
        - "${IMAGE_REPO:-antigravity-headless}:${ANTIGRAVITY_VERSION:-2.28.2}"
        - "${IMAGE_REPO:-antigravity-headless}:latest"
    image: "${IMAGE_REPO:-antigravity-headless}:${ANTIGRAVITY_VERSION:-2.28.2}"
    container_name: antigravity-headless
    stdin_open: true
    tty: true
    ports:
      - "${HTTP_PORT:-8080}:8080"
      - "${HTTPS_PORT:-8443}:8443"
    environment:
      - HTTP_PORT=8080
      - HTTPS_PORT=8443
      - REMOTE_ACCESSIBLE=1
    volumes:
      - antigravity-gemini:/home/antigravity/.gemini
      - antigravity-config:/home/antigravity/.config
      - ./workspace:/workspace
    restart: unless-stopped

volumes:
  antigravity-gemini:
  antigravity-config:
